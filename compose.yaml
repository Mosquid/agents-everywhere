name: hola

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.6
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${HOLA_HOST_IP:?Run python3 hola/configure.py first}
          advertise_internal_ip: true
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}

  sip:
    image: livekit/sip:v1.14.0
    networks:
      default:
        aliases: [orange-gateway]
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5064:5064/udp"
      - "5070:5070/udp"
      - "10000-10100:10000-10100/udp"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        listen_ip: 0.0.0.0
        rtp_port: 10000-10100
        use_external_ip: false
        nat_1_to_1_ip: ${HOLA_HOST_IP}
        logging:
          level: info

  orange-sip-proxy:
    build: ./hola/orange-proxy
    restart: unless-stopped
    network_mode: service:sip
    environment:
      ORANGE_AUTH_USERNAME: ${ORANGE_AUTH_USERNAME:?Set ORANGE_AUTH_USERNAME}
      ORANGE_PASSWORD: ${ORANGE_PASSWORD:?Set ORANGE_PASSWORD}
      ORANGE_FROM_NUMBER: ${ORANGE_FROM_NUMBER:?Set ORANGE_FROM_NUMBER}
      ORANGE_DOMAIN: ${ORANGE_DOMAIN:-sip.orange.es}
      ORANGE_PROXY_HOST: ${ORANGE_PROXY_HOST:-proxy2.sip.orange.es}
      ORANGE_PROXY_PORT: ${ORANGE_PROXY_PORT:-5060}
      ORANGE_PROXY_PUBLIC_HOST: ${HOLA_HOST_IP}
      ORANGE_PROXY_UPSTREAM_HOST: 127.0.0.1
      ORANGE_PROXY_TRACE_SIP: "false"
    depends_on:
      sip:
        condition: service_started

  context-api:
    build: ./hola/context-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CONTEXT_READ_TOKEN: ${CONTEXT_READ_TOKEN:?Set CONTEXT_READ_TOKEN}
      CONTEXT_ADMIN_TOKEN: ${CONTEXT_ADMIN_TOKEN:?Set CONTEXT_ADMIN_TOKEN}
      CALL_WRITE_TOKEN: ${CALL_WRITE_TOKEN:?Set CALL_WRITE_TOKEN}
    volumes:
      - context-data:/data
      - call-recordings:/recordings:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    image: hola-agent
    build: ./hola
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      context-api:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      CONTEXT_API_URL: http://context-api:8090
      CONTEXT_READ_TOKEN: ${CONTEXT_READ_TOKEN}
      CALL_WRITE_TOKEN: ${CALL_WRITE_TOKEN}
      RECORDINGS_DIR: /recordings
    volumes:
      - call-recordings:/recordings

  sip-setup:
    image: hola-agent
    build: ./hola
    restart: on-failure
    command: [python, setup-orange.py]
    depends_on:
      livekit:
        condition: service_started
      sip:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ORANGE_FROM_NUMBER: ${ORANGE_FROM_NUMBER}
      ORANGE_PROXY_ADDRESS: orange-gateway:5064
      ORANGE_PROXY_ALLOWED_ADDRESS: 127.0.0.1/32

  web-chat:
    build: ./hola/web-chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      context-api:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      CONTEXT_API_URL: http://context-api:8090
      CONTEXT_ADMIN_TOKEN: ${CONTEXT_ADMIN_TOKEN}

volumes:
  redis-data:
  context-data:
  call-recordings:
